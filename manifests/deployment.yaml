apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: crash-test
  name: crash-test
spec:
  replicas: 2
  selector:
    matchLabels:
      app: crash-test
  template:
    metadata:
      labels:
        app: crash-test
    spec:
      containers:
      - name: crash-test
        image: ghcr.io/mborne/crash-test:latest
        ports:
          - name: http
            containerPort: 3000
        readinessProbe:
          httpGet:
            path: /api/health
            port: http
          failureThreshold: 5
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /api/health
            port: http
          initialDelaySeconds: 5
          failureThreshold: 1
          periodSeconds: 1
        env:
        - name: APP_PORT
          value: '3000'
        - name: LOG_FORMAT
        securityContext:
          allowPrivilegeEscalation: false
          privileged: false
          runAsUser: 1000
          runAsNonRoot: true
          capabilities:
            drop:
              - ALL
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 256Mi

